[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resolve-mcp-server"
version = "1.1.0"
description = "AI editing tools and read-only resources for DaVinci Resolve"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.0.0,<2", "httpx>=0.27.0", "Pillow>=10.0.0", "python-dotenv>=1.0.0"]

[project.scripts]
resolve-mcp-server = "src.server:main"

[tool.setuptools.packages.find]
include = ["src", "src.*"]
